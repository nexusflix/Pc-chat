name: ThyoCloud Win11 Persistent

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: "URL HTTPS da ISO oficial/licenciada do Windows 11"
        required: false
        default: "https://software-static.download.prss.microsoft.com/db/22631.2861.231204-0538.23H2_NI_RELEASE_SVC_REFRESH_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso"
        type: string

      disk_size:
        description: "Tamanho do disco virtual"
        required: false
        default: "64G"
        type: string

      vm_time:
        description: "Tempo da VM em minutos"
        required: false
        default: "330"
        type: string

jobs:
  win11:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar QEMU
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ./scripts/prepare.sh

      - name: Baixar ISO
        shell: bash
        env:
          ISO_URL: ${{ inputs.iso_url }}
        run: |
          mkdir -p vm

          DEFAULT_ISO="https://software-static.download.prss.microsoft.com/db/22631.2861.231204-0538.23H2_NI_RELEASE_SVC_REFRESH_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso"
          TARGET_URL="${ISO_URL:-$DEFAULT_ISO}"

          echo "Baixando ISO de: $TARGET_URL"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            "$TARGET_URL" \
            -o vm/windows11.iso

          ls -lh vm/windows11.iso

      - name: Restaurar disco persistente
        shell: bash
        run: |
          ./scripts/restore.sh

      - name: Criar disco se necessário
        shell: bash
        env:
          DISK_SIZE: ${{ inputs.disk_size }}
        run: |
          if [ ! -f vm/windows11.qcow2 ]; then
            echo "Criando disco virtual..."

            qemu-img create \
              -f qcow2 \
              vm/windows11.qcow2 \
              "$DISK_SIZE"
          else
            echo "Disco existente encontrado."
          fi

      - name: Mostrar ambiente
        shell: bash
        run: |
          echo "======================================"
          echo "QEMU"
          echo "======================================"

          qemu-system-x86_64 --version

          echo ""
          echo "======================================"
          echo "DISCO"
          echo "======================================"

          qemu-img info vm/windows11.qcow2

      - name: Iniciar VM
        shell: bash
        run: |
          chmod +x scripts/run-vm.sh
          ./scripts/run-vm.sh

          echo ""
          echo "VM iniciada."

          if [ -f vm/qemu.pid ]; then
            echo "PID: $(cat vm/qemu.pid)"
          fi

      - name: Manter VM ativa
        shell: bash
        env:
          VM_TIME: ${{ inputs.vm_time }}
        run: |
          echo "======================================"
          echo "THYOCLOUD WINDOWS 11"
          echo "======================================"
          echo ""
          echo "VM ficará ativa por:"
          echo "${VM_TIME} minutos"
          echo ""

          END_TIME=$((SECONDS + VM_TIME * 60))

          while [ "$SECONDS" -lt "$END_TIME" ]; do

            if [ -f vm/qemu.pid ]; then
              PID=$(cat vm/qemu.pid)

              if kill -0 "$PID" 2>/dev/null; then
                REMAINING=$((END_TIME - SECONDS))

                echo "Windows ativo | PID=$PID | restante=${REMAINING}s"

                sleep 30
              else
                echo "QEMU encerrou."

                break
              fi
            else
              echo "PID do QEMU não encontrado."

              break
            fi

          done

      - name: Parar VM com segurança
        if: always()
        shell: bash
        run: |
          chmod +x scripts/stop-vm.sh

          ./scripts/stop-vm.sh || true

      - name: Salvar estado
        if: always()
        shell: bash
        run: |
          chmod +x scripts/save.sh

          ./scripts/save.sh || true

      - name: Informações finais
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "FINALIZADO"
          echo "======================================"

          if [ -f vm/windows11.qcow2 ]; then
            echo ""
            echo "Disco:"
            qemu-img info vm/windows11.qcow2
          fi

          if [ -f state/windows11-latest.qcow2 ]; then
            echo ""
            echo "Estado salvo:"
            ls -lh state/windows11-latest.qcow2
          fi
